name: 'sentinel_insurance'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'ekai_dbt'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
models:
  sentinel_insurance:
    # Staging models - lightweight transformations, views for performance
    staging:
      +materialized: view
      +schema: staging

    # Intermediate models - business logic transformations, views for flexibility
    intermediate:
      +materialized: view
      +schema: intermediate

    # Marts models - final dimensional models, tables for query performance
    marts:
      +materialized: table
      +schema: marts
      +tags: [marts, mart]

# Snowflake-specific configurations
vars:
  # Date and time formats
  date_format: 'YYYY-MM-DD'
  timestamp_format: 'YYYY-MM-DD HH24:MI:SS'
